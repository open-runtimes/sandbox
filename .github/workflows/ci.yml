name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false # golangci-lint-action manages its own cache

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test -race ./...

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: sandbox:ci

      # The image is only useful if the contract answers from inside it, so
      # exercise all three routes against the container we just built.
      - name: Smoke test the contract
        run: |
          docker run -d --name sandbox -p 3000:3000 sandbox:ci
          for _ in $(seq 1 30); do
            curl -fsS localhost:3000/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS localhost:3000/healthz

          curl -fsS -X PUT localhost:3000/files/hello.txt --data-binary 'hi'
          test "$(curl -fsS localhost:3000/files/hello.txt)" = "hi"

          curl -fsS -X POST localhost:3000/execute \
            -H 'Content-Type: application/json' \
            -d '{"command": "cat hello.txt"}' | grep -q '"exitCode":0'

          curl -fsS -X DELETE localhost:3000/files/hello.txt

      - name: Container logs
        if: always()
        run: docker logs sandbox
